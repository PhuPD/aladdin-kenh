<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kênh Ads Aladdin</title>
<meta name="description" content="Meta Ads phễu mua theo chương trình chạy: chi tiêu, lượt mua, giá lượt mua, KHTN, giá KHTN theo thương hiệu và khu vực.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f4f7fb; --card:#ffffff; --line:#e3e8f0; --line2:#eef2f7;
  --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --brand:#2a78d6; --brand-soft:#e8f1fc;
  --up:#0f9d58; --up-soft:#e6f6ee; --hold:#2a78d6; --hold-soft:#e8f1fc;
  --watch:#b7791f; --watch-soft:#fdf4e1; --down:#e34948; --down-soft:#fdecec;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --other:#a3adbb;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:13px}
.fresh{font-size:12px;color:var(--ink2);text-align:right}
.fresh b{color:var(--ink)}
.bar{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.94);backdrop-filter:blur(6px);padding:8px 0;margin:0 0 10px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--ink2)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dates{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.dates input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 2px}
.card h3{font-size:14px;margin:0 0 8px}
.card .hint{color:var(--ink2);font-size:12px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:2px;color:var(--ink2)}
.good{color:var(--up)} .bad{color:var(--down)}
.brands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.bcard{cursor:pointer;transition:box-shadow .15s,border-color .15s}
.bcard:hover{border-color:var(--brand);box-shadow:0 4px 18px rgba(42,120,214,.12)}
.bcard .name{font-weight:700;font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.mini .l{color:var(--ink2);font-size:12px}
.mini .v{font-weight:600;font-variant-numeric:tabular-nums}
.pick{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;display:grid;gap:4px}
.pick b{font-weight:600}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-top{background:#fff3e8;color:#c2410c}
.t-cheap{background:#e6f6ee;color:#0b7a43}
.t-up{background:var(--up-soft);color:var(--up)}
.t-hold{background:var(--hold-soft);color:var(--hold)}
.t-watch{background:var(--watch-soft);color:var(--watch)}
.t-down{background:var(--down-soft);color:var(--down)}
.t-gray{background:#eef2f7;color:var(--ink2)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:600;background:#f8fafc;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td.prog{white-space:normal;min-width:190px}
tr.total td{font-weight:700;background:#f8fafc}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#f5f9ff}
.share{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.share i{display:block;height:8px;border-radius:4px;background:var(--brand);min-width:2px}
.share span{min-width:38px}
tr.sub td{background:#fbfcfe;font-size:12.5px;color:var(--ink2)}
tr.sub td:first-child{padding-left:26px;white-space:normal}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.regions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.recs{display:grid;gap:10px}
.rec{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 12px}
.rec.up{border-left-color:var(--up)} .rec.down{border-left-color:var(--down)} .rec.hold{border-left-color:var(--hold)} .rec.watch{border-left-color:var(--watch)} .rec.content{border-left-color:var(--s7)}
.rec .h{font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rec .b{font-size:12.5px;color:var(--ink2);margin-top:4px}
.rec .b b{color:var(--ink)}
.ctkm{font-size:12px;color:var(--ink2);background:#f8fafc;border-radius:8px;padding:6px 8px;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin:6px 0 4px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(15,23,42,.12);padding:8px 10px;font-size:12px;min-width:180px;display:none;z-index:5}
.tip .t{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.metric-sw{display:flex;gap:6px;flex-wrap:wrap}
.quick{width:100%;min-width:760px}
.quick td{vertical-align:top}
.quick td.w{white-space:normal;text-align:left;min-width:170px}
.quick .pn{font-weight:600;color:var(--ink)}
.quick .pm{font-size:12px;color:var(--ink2)}
.ctlist{display:grid;gap:8px}
.ct{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
.ct .n{font-weight:600}
.ct .m{color:var(--ink2);font-size:12px;margin-top:2px}
.muted{color:var(--ink3)}
.empty{padding:24px;text-align:center;color:var(--ink2)}
.loading{padding:60px 0;text-align:center;color:var(--ink2)}
.err{background:var(--down-soft);color:var(--down);padding:10px 12px;border-radius:10px;margin-bottom:12px;display:none}
details.note{font-size:12px;color:var(--ink2);margin-top:6px}
details.note summary{cursor:pointer}
footer{color:var(--ink3);font-size:12px;padding:8px 0 30px}
@media (max-width:1000px){.brands{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){
  .wrap{padding:12px 16px}
  .brands{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:18px} h1{font-size:19px}
  .dates{margin-left:0;width:100%}.dates input{flex:1;min-width:0}
  .fresh{text-align:left}
  .bar{position:static}
  .tbl-wrap td:first-child,.tbl-wrap th:first-child{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--line2)}
  .tbl-wrap th:first-child,.tbl-wrap tr.total td:first-child{background:#f8fafc}.tbl-wrap tr.sub td:first-child{background:#fbfcfe}
  td.prog{min-width:150px;max-width:170px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Kênh Ads Aladdin · Phễu mua theo chương trình</h1>
      <div class="sub">Meta Ads · chỉ campaign phễu <b>mua</b> có chi tiêu trong khoảng xem · số tính lại theo skill <i>aladdin-meta-ads-reporting</i></div>
    </div>
    <div class="fresh" id="fresh">Đang tải…</div>
  </header>

  <div class="bar">
    <div class="row">
      <div class="tabs" id="brandTabs"></div>
      <div class="dates">
        <span class="chip" data-p="7">7 ngày</span>
        <span class="chip" data-p="14">14 ngày</span>
        <span class="chip" data-p="30">30 ngày</span>
        <span class="chip" data-p="mtd">Tháng này</span>
        <span class="chip" data-p="lm">Tháng trước</span>
        <input type="date" id="dFrom" aria-label="Từ ngày"> <span class="muted">→</span> <input type="date" id="dTo" aria-label="Đến ngày">
      </div>
    </div>
  </div>

  <div class="err" id="err"></div>
  <main id="main"><div class="loading">Đang tải số liệu…</div></main>
  <footer id="foot"></footer>
</div>

<script>
var GIST='92057b85d130af8a13aa628c5126cdea', USER='PhuPD';
var ORDER=['LW','TL','BTQM','GM'];
var REGION_ORDER=['Hà Nội','Hải Phòng','Hải Dương','Thanh Hóa','Nghệ An','Đà Nẵng','Huế','Bắc Giang','chưa rõ'];
var SERIES=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
var MIN_P=5;            // tối thiểu lượt mua để xếp "rẻ nhất" / đề xuất tăng-giảm
var D=null, S={brand:'ALL',region:'Tổng',from:null,to:null,metric:'purchases',open:{}};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

// ---------- định dạng ----------
var nf0=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}), nf1=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:1,minimumFractionDigits:1});
function money(v){if(v==null||!isFinite(v))return '—';if(Math.abs(v)>=1e9)return nf1.format(v/1e9)+' tỷ';if(Math.abs(v)>=1e6)return nf1.format(v/1e6)+' tr';if(Math.abs(v)>=1e3)return nf0.format(v/1e3)+'k';return nf0.format(v)}
function unit(v){if(v==null||!isFinite(v))return '—';return nf0.format(Math.round(v/1000))+'k'}
function cnt(v){return v==null?'—':nf0.format(v)}
function full(v){return v==null||!isFinite(v)?'—':nf0.format(Math.round(v))+' đ'}
function pct(v){return v==null||!isFinite(v)?'—':nf0.format(v*100)+'%'}
function dvn(iso){var p=iso.split('-');return p[2]+'/'+p[1]}
function dvnY(iso){var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function addDays(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)}
function fold(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().replace(/\s+/g,' ').trim()}
function todayHN(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}).format(new Date())}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

// ---------- tính số (logic skill) ----------
// row: [ngày, campaign, spend, purchase, omni_purchase, order_created, conv_started_7d, total_connection]
function firstPos(a,b,c){return a>0?a:(b>0?b:(c>0?c:0))}
function aggCampaigns(brand,from,to){
  var i0=D.days.indexOf(from), i1=D.days.indexOf(to), m={};
  if(i0<0||i1<0)return [];
  for(var k=0;k<D.rows.length;k++){var r=D.rows[k];if(r[0]<i0||r[0]>i1)continue;var c=D.campaigns[r[1]];if(brand!=='ALL'&&c[0]!==brand)continue;
    var a=m[r[1]]||(m[r[1]]=[0,0,0,0,0,0]);for(var j=0;j<6;j++)a[j]+=(r[2+j]||0)}
  var out=[];
  for(var id in m){var a=m[id];if(a[0]<=0)continue;var c=D.campaigns[id];
    // skill: chỉ giữ campaign spend>0; lượt mua/KHTN theo thứ tự fallback ở cấp campaign trong khoảng xem
    out.push({id:+id,brand:c[0],region:c[1],program:c[2],name:c[3],account:c[4],spend:a[0],purchases:firstPos(a[1],a[2],a[3]),leads:firstPos(a[4],a[5],0)})}
  return out}
function sum(list){var s={spend:0,purchases:0,leads:0,n:list.length};list.forEach(function(x){s.spend+=x.spend;s.purchases+=x.purchases;s.leads+=x.leads});s.cpa=s.purchases?s.spend/s.purchases:null;s.cpl=s.leads?s.spend/s.leads:null;return s}
function groupBy(list,key){var g={};list.forEach(function(x){(g[x[key]]=g[x[key]]||[]).push(x)});return Object.keys(g).map(function(k){var s=sum(g[k]);s.key=k;s.items=g[k];return s})}
function regionsOf(list){var rs={};list.forEach(function(x){rs[x.region]=1});return REGION_ORDER.filter(function(r){return rs[r]}).concat(Object.keys(rs).filter(function(r){return REGION_ORDER.indexOf(r)<0}))}
function topBuy(groups){var g=groups.filter(function(x){return x.purchases>0}).sort(function(a,b){return b.purchases-a.purchases||a.spend-b.spend});return g[0]||null}
function cheapest(groups){var g=groups.filter(function(x){return x.purchases>=MIN_P}).sort(function(a,b){return a.cpa-b.cpa});if(g.length)return {g:g[0],strict:true};
  g=groups.filter(function(x){return x.purchases>0}).sort(function(a,b){return a.cpa-b.cpa});return g.length?{g:g[0],strict:false}:null}
function prevRange(){var n=diffDays(S.from,S.to)+1;var pt=addDays(S.from,-1),pf=addDays(S.from,-n);if(pf<D.days[0])return null;return {from:pf,to:pt}}

// màu theo chương trình: cố định theo xếp hạng chi tiêu toàn bộ lịch sử của thương hiệu (màu đi theo chương trình, không theo hạng trong khoảng xem)
var COLOR={};
function buildColors(){ORDER.forEach(function(b){var t={};D.rows.forEach(function(r){var c=D.campaigns[r[1]];if(c[0]===b)t[c[2]]=(t[c[2]]||0)+r[2]});
  Object.keys(t).sort(function(x,y){return t[y]-t[x]}).forEach(function(p,i){COLOR[b+'|'+p]=i<8?css(SERIES[i]):css('--other')})})}
function colorOf(b,p){return COLOR[b+'|'+p]||css('--other')}

// ---------- CTKM ----------
function ctkmMonthItems(brand,month){var it=(D.ctkm&&D.ctkm.items)||[];var months=it.filter(function(x){return x.brand===brand}).map(function(x){return x.month}).filter(function(m){return m<=month}).sort();
  var use=months.length?months[months.length-1]:null;return it.filter(function(x){return x.brand===brand&&x.month===use})}
function parseEnd(period){var m=String(period||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/g);if(!m||!m.length)return null;var p=m[m.length-1].split('/');return p[2]+'-'+('0'+p[1]).slice(-2)+'-'+('0'+p[0]).slice(-2)}
function ctkmStatus(x){var t=fold(x.type);if(t.indexOf('dung')===0)return {k:'stop',l:'Đã dừng'};var e=parseEnd(x.period);var td=todayHN();
  if(e&&/^\d{4}-\d\d-\d\d$/.test(e)&&e.length===10){if(e<td)return {k:'stop',l:'Hết hạn '+dvn(e)};if(diffDays(td,e)<=7)return {k:'soon',l:'Còn '+diffDays(td,e)+' ngày (hết '+dvn(e)+')',end:e}}
  return {k:'on',l:'Đang hiệu lực'}}
function matchCtkm(brand,program,items){var map=(D.ctkmMap||{})[brand]||{};var parts=program.split(' + ');var res=[];
  parts.forEach(function(p){(map[p]||[]).forEach(function(pat){items.forEach(function(x){var ok=pat.indexOf('type:')===0?fold(x.type).indexOf(fold(pat.slice(5)))>=0:fold(x.name).indexOf(fold(pat))>=0;if(ok&&res.indexOf(x)<0)res.push(x)})})});
  // ưu tiên dòng đang hiệu lực
  var o={on:0,soon:1,stop:2};res=res.map(function(x,i){return [x,i]}).sort(function(a,b){return o[ctkmStatus(a[0]).k]-o[ctkmStatus(b[0]).k]||a[1]-b[1]}).map(function(x){return x[0]});return res}
function ctkmLine(x){var st=ctkmStatus(x);var cls=st.k==='stop'?'t-down':st.k==='soon'?'t-watch':'t-up';
  return '<div class="ctkm"><span class="tag '+cls+'">'+esc(st.l)+'</span> <b>'+esc(x.name)+'</b>'+(x.period?' · '+esc(x.period.replace(/\n/g,' ')):'')+(x.weekend?' · '+esc(x.weekend.replace(/\n/g,' ')):'')+(x.scope?'<br><span class="muted">Phạm vi: '+esc(x.scope.replace(/\n/g,' ').slice(0,160))+'</span>':'')+'</div>'}

// ---------- đề xuất ----------
function halfCpa(items){ // so CPA nửa sau vs nửa đầu khoảng xem để bắt content mỏi
  var n=diffDays(S.from,S.to)+1;if(n<6)return null;var mid=addDays(S.from,Math.floor(n/2)-1);
  var ids={};items.forEach(function(x){ids[x.id]=1});
  var a=sum(aggCampaigns(items[0].brand,S.from,mid).filter(function(x){return ids[x.id]})),b=sum(aggCampaigns(items[0].brand,addDays(mid,1),S.to).filter(function(x){return ids[x.id]}));
  if(a.purchases<3||b.purchases<3)return null;return {a:a,b:b,ch:b.cpa/a.cpa-1}}
function recommend(brand,scope,groups,total,isBrandTotal){
  var month=S.to.slice(0,7), items=ctkmMonthItems(brand,month), out=[];
  var conv=total.leads?total.purchases/total.leads:null;
  groups.forEach(function(g){
    var share=total.purchases?g.purchases/total.purchases:0, ct=matchCtkm(brand,g.key,items), st=ct.length?ctkmStatus(ct[0]):null;
    var r={g:g,ct:ct,act:'hold',why:'',data:'Chi '+money(g.spend)+' · '+cnt(g.purchases)+' lượt mua · giá '+unit(g.cpa)+' (TB '+scope+' '+unit(total.cpa)+') · '+pct(share)+' lượt mua',content:[]};
    var lastDays=sum(aggCampaigns(brand,addDays(S.to,-2),S.to).filter(function(x){return g.items.some(function(y){return y.id===x.id})}));
    if(st&&st.k==='stop'&&lastDays.spend>0){r.act='down';r.title='Dừng/chuyển ngân sách';r.why='CTKM "'+ct[0].name+'" '+st.l.toLowerCase()+' nhưng 3 ngày cuối vẫn tiêu '+money(lastDays.spend)+'.';r.todo='Tắt campaign hoặc đổi sang CTKM đang hiệu lực; chuyển ngân sách sang chương trình giá tốt nhất.'}
    else if(lastDays.spend<=0){r.act='watch';r.title=st&&st.k==='stop'?'CTKM đã kết thúc':'Đã ngừng chạy';r.why=(st&&st.k==='stop'?'CTKM "'+ct[0].name+'" '+st.l.toLowerCase()+'; ':'')+'3 ngày cuối khoảng xem không còn chi tiêu.';r.todo=g.purchases>=MIN_P&&g.cpa<=total.cpa*0.85?'Kết quả tốt (rẻ hơn TB '+pct(1-g.cpa/total.cpa)+'): đề xuất tái chạy khi có đợt CTKM tương tự, giữ content làm mẫu.':'Không phân bổ thêm; dùng làm mốc so sánh.'}
    else if(g.purchases===0&&g.spend>=Math.max(total.cpa||0,1)){r.act='down';r.title='Giảm ngân sách';r.why='Đã tiêu ≥ 1 lần giá lượt mua TB mà chưa có lượt mua.';r.todo='Giảm 50% hoặc tạm dừng, kiểm tra offer/target trước khi chạy lại.'}

  var idle=[];if(isBrandTotal){var used=[];groups.forEach(function(g){matchCtkm(brand,g.key,items).forEach(function(x){used.push(x)})});

  return {list:out,idle:idle}}

  function X(i){return pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1))}function Y(v){return pt+(H-pt-pb)*(1-v/ymax)}

  for(var k=0;k<=4;k++){var y=Y(nice*k);svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#eef2f7"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="#94a3b8">'+fmtAxis(nice*k)+'</text>'}

    svg+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'});

  var leg='<div class="legend">'+series.map(function(s){return '<span><span class="dot" style="background:'+(s==='Khác'?css('--other'):colorOf(brand,s))+'"></span>'+esc(s)+'</span>'}).join('')+'</div>';
  var sw='<div class="metric-sw">'+[['purchases','Lượt mua'],['spend','Chi tiêu'],['cpa','Giá lượt mua'],['leads','KHTN']].map(function(m){return '<span class="chip'+(S.metric===m[0]?' on':'')+'" data-m="'+m[0]+'">'+m[1]+'</span>'}).join('')+'</div>';
  return {html:sw+leg+'<div class="chart" id="chart">'+svg+'<div class="tip" id="tip"></div></div>',bind:function(){
    var el=$('#chart');if(!el)return;var svgEl=el.querySelector('svg'),tip=$('#tip'),xh=el.querySelector('#xh');

      tip.style.display='block';var px=X(i)/W*r.width;tip.style.left=Math.min(Math.max(0,px+12),r.width-tip.offsetWidth)+'px';tip.style.top='8px'}
    function out(){tip.style.display='none';xh.setAttribute('visibility','hidden')}

      h+='<tr class="'+(rg==='Tổng'?'total':'clk')+'" data-r="'+esc(rg)+'"><td>'+esc(rg==='chưa rõ'?'Chưa rõ KV':rg)+'</td><td>'+money(s.spend)+'</td><td>'+cnt(s.purchases)+'</td><td>'+unit(s.cpa)+'</td><td>'+cnt(s.leads)+'</td><td>'+unit(s.cpl)+'</td>'+
      '<td class="w">'+(tb?'<div class="pn"><span class="dot" style="background:'+colorOf(b,tb.key)+'"></span>'+esc(tb.key)+'</div><div class="pm">'+cnt(tb.purchases)+' lượt · '+pct(s.purchases?tb.purchases/s.purchases:0)+' · giá '+unit(tb.cpa)+'</div>':'—')+'</td>'+
      '<td class="w">'+(ch&&ch.strict?'<div class="pn"><span class="dot" style="background:'+colorOf(b,ch.g.key)+'"></span>'+esc(ch.g.key)+'</div><div class="pm">'+unit(ch.g.cpa)+' · '+cnt(ch.g.purchases)+' lượt</div>':'<span class="muted">chưa đủ dữ liệu</span>')+'</td></tr>'});
    h+='</tbody></table></div></div>'}
  // bảng chương trình + xu hướng
  var tc=trendChart(b,list);
  h+='<div class="card"><h2>Chương trình chạy ads · '+(S.region==='Tổng'?'Tổng':esc(S.region))+'</h2><p class="hint">Xếp theo lượt mua. Giá lượt mua <span class="good">xanh</span> = rẻ hơn TB ≥15%, <span class="bad">đỏ</span> = đắt hơn ≥30%. Bấm một chương trình để xem campaign.</p>'+programTable(b,list,tot)+'</div>';
  h+='<div class="grid2"><div class="card"><h2>Xu hướng theo ngày</h2><p class="hint">5 chương trình chi nhiều nhất + Khác. Rê/chạm vào biểu đồ để xem số từng ngày.</p>'+tc.html+'</div>';
  var rc=recommend(b,scope,groupBy(list,'program'),tot,S.region==='Tổng');
  h+='<div class="card"><h2>Đề xuất ngân sách & content</h2><p class="hint">Tự tính theo khoảng xem, so với giá lượt mua TB '+esc(scope)+' ('+unit(tot.cpa)+'), đối chiếu CTKM tháng '+S.to.slice(5,7)+'/'+S.to.slice(0,4)+'. Là gợi ý, cần anh duyệt.</p><div class="recs">';
  rc.list.forEach(function(r){var tg={up:'t-up',down:'t-down',hold:'t-hold',watch:'t-watch'}[r.act];
    h+='<div class="rec '+r.act+'"><div class="h"><span class="tag '+tg+'">'+esc(r.title)+'</span><span><span class="dot" style="background:'+colorOf(b,r.g.key)+'"></span>'+esc(r.g.key)+'</span></div>'+
    '<div class="b"><b>Số liệu:</b> '+esc(r.data)+'<br><b>Nguyên nhân:</b> '+esc(r.why)+'<br><b>Hành động:</b> '+esc(r.todo)+(r.content.length?'<br><b>Content:</b> '+r.content.map(esc).join('<br>• '):'')+'</div>'+
    (r.ct.length?ctkmLine(r.ct[0]):'<div class="ctkm muted">Chưa khớp dòng CTKM trong sheet (chương trình theo tên campaign).</div>')+'</div>'});
  if(rc.idle.length){h+='<div class="rec content"><div class="h"><span class="tag t-gray">CTKM chưa có ads phễu mua</span></div><div class="b">Đang hiệu lực trong sheet CTKM nhưng chưa thấy campaign phễu mua tương ứng trong khoảng xem. Cân nhắc sản xuất content test nếu offer phù hợp:</div>'+rc.idle.slice(0,8).map(ctkmLine).join('')+'</div>'}
  h+='</div></div></div>';
  $('#main').innerHTML=h;tc.bind()}

function render(){
  renderTabs();
  document.querySelectorAll('.dates .chip').forEach(function(c){c.classList.toggle('on',c.dataset.p===S.preset)});
  $('#dFrom').value=S.from;$('#dTo').value=S.to;
  if(S.brand==='ALL')renderOverview();else renderBrand();
  location.replace('#'+[S.brand,encodeURIComponent(S.region),S.from,S.to].join('/'))}

// ---------- khoảng thời gian ----------
function applyPreset(p){var last=D.days[D.days.length-1],first=D.days[0];S.preset=p;
  if(p==='mtd'){S.to=last;S.from=last.slice(0,8)+'01'}
  else if(p==='lm'){var d=new Date(last.slice(0,8)+'01T00:00:00Z');d.setUTCDate(0);S.to=d.toISOString().slice(0,10);S.from=S.to.slice(0,8)+'01'}
  else{S.to=last;S.from=addDays(last,-(+p-1))}
  if(S.from<first)S.from=first;if(S.to<first)S.to=first}

// ---------- tải dữ liệu ----------
function fetchJSON(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function load(){
  // API gist: bản mới nhất; file >1MB bị cắt -> đọc raw_url của đúng revision. Lỗi API (giới hạn 60 lượt/giờ) -> raw CDN (trễ ≤5 phút)
  return fetchJSON('https://api.github.com/gists/'+GIST).then(function(g){var f=g.files['data.json'];if(!f)throw new Error('gist chưa có data.json');
      return f.truncated?fetchJSON(f.raw_url):JSON.parse(f.content)})
    .catch(function(){return fetchJSON('https://gist.githubusercontent.com/'+USER+'/'+GIST+'/raw/data.json?t='+Date.now())})}
function boot(){
  load().then(function(d){D=d;buildColors();
    var last=D.days[D.days.length-1];
    $('#dFrom').min=$('#dTo').min=D.days[0];$('#dFrom').max=$('#dTo').max=last;
    var hs=location.hash.slice(1).split('/');
    if(hs.length===4&&D.days.indexOf(hs[2])>=0&&D.days.indexOf(hs[3])>=0&&hs[2]<=hs[3]){S.brand=(hs[0]==='ALL'||D.brands[hs[0]])?hs[0]:'ALL';S.region=decodeURIComponent(hs[1]||'Tổng');S.from=hs[2];S.to=hs[3];S.preset=(S.to===last&&diffDays(S.from,S.to)===13)?'14':null}
    else applyPreset('14');
    var g=new Date(D.generatedAt);
    $('#fresh').innerHTML='Cập nhật lúc <b>'+g.toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})+'</b> · số đến hết <b>'+dvnY(last)+'</b><br>Tự cập nhật 07:55 mỗi sáng · dữ liệu từ '+dvnY(D.days[0]);
    $('#foot').innerHTML='Nguồn: Meta Ads (System User read-only) · taxonomy chương trình '+esc(D.taxonomyVersion||'')+' · CTKM: sheet "MB_Thông Báo Chương Trình QC- KM 2026". Lượt mua = onsite_conversion.purchase (fallback omni_purchase → messaging_order_created_v2), KHTN = messaging_conversation_started_7d (fallback total_messaging_connection), áp ở cấp campaign trong khoảng xem như skill. Khu vực lấy từ tên campaign; "Chưa rõ KV" = tên không có mã khu vực.';
    var stale=diffDays(last,todayHN())>1;if(stale){$('#err').style.display='block';$('#err').textContent='Số liệu mới đến '+dvnY(last)+' — lần cập nhật sáng nay có thể chưa chạy (Mac mini tắt/mất mạng?).'}
    render()}).catch(function(e){$('#main').innerHTML='<div class="card empty">Không tải được số liệu: '+esc(e.message)+'</div>'})}

document.addEventListener('click',function(e){var t=e.target.closest('[data-b],[data-r],[data-p],[data-m],tr.clk[data-k]');if(!t||!D)return;
  if(t.dataset.b){e.preventDefault();S.brand=t.dataset.b;S.region='Tổng';S.open={};window.scrollTo({top:0,behavior:'smooth'})}
  else if(t.dataset.r){if(t.dataset.r==='Tổng'&&t.tagName==='TR')return;S.region=t.dataset.r;S.open={}}
  else if(t.dataset.p){applyPreset(t.dataset.p)}
  else if(t.dataset.m){S.metric=t.dataset.m}
  else if(t.dataset.k){S.open[t.dataset.k]=!S.open[t.dataset.k]}
  render()});
function onDate(){var f=$('#dFrom').value,t=$('#dTo').value;if(!f||!t)return;if(f>t){var x=f;f=t;t=x}
  if(D.days.indexOf(f)<0)f=D.days[0];if(D.days.indexOf(t)<0)t=D.days[D.days.length-1];S.from=f;S.to=t;S.preset=null;render()}
$('#dFrom').addEventListener('change',onDate);$('#dTo').addEventListener('change',onDate);
boot();
</script>
</body>
</html>
